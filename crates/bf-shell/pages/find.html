<!DOCTYPE html>
<html>
<style>
{{theme}}
/* La barra de buscar en la página (Ctrl+F): una tarjeta arriba a la derecha de la página, con
   {{pad}} px transparentes alrededor para la sombra. El trazo ámbar de arriba no llega a la
   esquina derecha: el marco abierto del logo. Los iconos los dibuja findbar.rs en los huecos
   .icon. */
html, body { margin: 0; background: transparent; }
body { padding: {{pad}}px; font-family: var(--font); font-size: var(--chrome-size); color: var(--text); }
#bar {
  position: relative;
  display: flex;
  align-items: center;
  width: {{width}}px;
  height: 40px;
  box-sizing: border-box;
  padding: 0 5px 0 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28), 0 1px 3px rgba(0, 0, 0, 0.16);
}
#bar.focus { border-color: var(--accent); }
.edge { position: absolute; top: -1px; left: 12px; right: 34px; height: 2px; border-radius: 0 0 2px 2px; background: var(--accent); }
.icon { flex: none; display: block; width: 16px; height: 16px; }
#field { flex: 1; min-width: 0; display: flex; align-items: center; height: 28px; margin: 0 6px 0 8px; white-space: pre; overflow: hidden; }
#text { flex: none; }
.ph { color: var(--text2); }
.sel { background: var(--selection); }
#caret { display: inline-block; width: 2px; height: 16px; border-radius: 1px; background: var(--accent); vertical-align: -3px; margin-right: -2px; }
#count { flex: none; margin: 0 8px 0 4px; color: var(--text2); font-size: 12px; white-space: nowrap; }
#count.none { color: var(--danger); }
.div { flex: none; width: 1px; height: 18px; margin: 0 4px; background: var(--border); }
.btn { flex: none; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 7px; box-sizing: border-box; }
.btn.hover { background: var(--hover); }
</style>
<div id="bar" class="{{bar_class}}"><span class="edge"></span><span id="icon-find" class="icon"></span><div id="field"><span id="text">{{text}}</span></div><span id="count" class="{{count_class}}">{{count}}</span><span class="div"></span><span id="prev" class="btn{{prev_hover}}"><span id="icon-prev" class="icon"></span></span><span id="next" class="btn{{next_hover}}"><span id="icon-next" class="icon"></span></span><span id="close" class="btn{{close_hover}}"><span id="icon-close" class="icon"></span></span></div>
</html>

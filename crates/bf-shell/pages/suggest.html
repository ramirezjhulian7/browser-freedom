<!DOCTYPE html>
<html>
<style>
{{theme}}
/* Las sugerencias de la barra de dirección: una tarjeta bajo el campo, del mismo ancho, con
   {{pad}} px transparentes alrededor para la sombra. Los iconos los dibuja chrome.rs en los
   huecos .icon. La fila elegida lleva el fondo ámbar diluido y el trazo del marco abierto. */
html, body { margin: 0; background: transparent; }
body { padding: {{pad}}px; font-family: var(--font); font-size: var(--chrome-size); color: var(--text); }
#list {
  box-sizing: border-box;
  padding: 5px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.30), 0 1px 3px rgba(0, 0, 0, 0.16);
}
.row { position: relative; display: flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 7px; white-space: nowrap; overflow: hidden; }
.row.hover { background: var(--hover); }
.row.sel { background: var(--accent-soft); }
.row .edge { position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--accent); }
.icon { flex: none; display: block; width: 16px; height: 16px; margin-right: 10px; }
.t { flex: none; max-width: 55%; overflow: hidden; white-space: nowrap; }
.u { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; margin-left: 12px; color: var(--text2); font-size: 12px; }
.row.sel .u { color: var(--accent-text); }
</style>
<div id="list">{{rows}}</div>
</html>

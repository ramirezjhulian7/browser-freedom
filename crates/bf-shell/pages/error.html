<!DOCTYPE html>
<html lang="es">
<meta charset="utf-8">
<title>{{title}}</title>
<style>
{{theme}}
{{style}}
body { padding-top: 88px; }
main { max-width: 620px; }
/* El marco abierto, grande, con el signo dentro: la página no salió por la esquina. */
.frame.big { width: 60px; height: 60px; border-width: 3px; border-radius: 15px; font-size: 26px; line-height: 54px; margin-bottom: 24px; }
.frame.big .gap { top: -4px; right: -4px; width: 24px; height: 24px; }
.kind { color: var(--accent-text); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
.card { margin: 24px 0 28px; }
.card code { overflow-wrap: anywhere; }
.detail { color: var(--text2); margin: 10px 0 0; font-size: 13px; }
</style>
<main>
  <span class="frame big">!<span class="gap"></span></span>
  <p class="kind">{{kind}}</p>
  <h1>{{title}}</h1>
  <p class="muted">{{explanation}}</p>
  <div class="card">
    <code>{{url}}</code>
    <p class="detail">{{detail}}</p>
  </div>
  <a class="button" href="{{url}}">Reintentar</a><a class="button quiet" href="about:home">Inicio</a>
</main>
</html>

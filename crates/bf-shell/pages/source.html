<!DOCTYPE html>
<html lang="es">
<meta charset="utf-8">
<title>{{title}}</title>
<style>
{{theme}}
{{style}}
body { padding: 24px 0; }
main { max-width: none; }
h1 { font-size: 15px; margin: 0 24px 16px; }
pre { margin: 0; padding: 0 24px; font-size: 12px; line-height: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
.n { display: inline-block; width: 48px; margin-right: 12px; text-align: right; color: var(--text2); }
</style>
<main>
  <h1>{{title}}</h1>
  <pre>{{lines}}</pre>
</main>
</html>

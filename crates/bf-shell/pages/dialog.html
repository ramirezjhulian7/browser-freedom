<!DOCTYPE html>
<html>
<style>
{{theme}}
/* Ocupa toda la ventana: el fondo oscurece la página y el diálogo queda centrado. */
html, body { margin: 0; height: 100%; }
body {
  background: rgba(0, 0, 0, 0.32);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font);
  font-size: var(--chrome-size);
  color: var(--text);
}
.dialog {
  width: 440px;
  box-sizing: border-box;
  padding: 20px 22px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.2);
}
.title { font-weight: 600; font-size: 15px; margin: 0 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.message { margin: 0 0 16px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
.field {
  display: flex;
  align-items: center;
  height: 30px;
  margin: 0 0 16px;
  padding: 0 8px;
  border: 2px solid var(--accent);
  border-radius: 7px;
  background: var(--chrome);
  white-space: pre;
  overflow: hidden;
}
.caret { display: inline-block; width: 1px; height: 18px; background: var(--text); }
.buttons { display: flex; justify-content: flex-end; }
.button {
  display: inline-block;
  min-width: 72px;
  margin-left: 8px;
  padding: 6px 14px;
  border-radius: 7px;
  border: 1px solid var(--border);
  text-align: center;
}
.button.hover { background: var(--hover); }
.button.ok { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
</style>
<div id="dialog" class="dialog">
<div class="title">{{title}}</div>
<div class="message">{{message}}</div>
{{field}}
<div class="buttons">{{buttons}}</div>
</div>
</html>

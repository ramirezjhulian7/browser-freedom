<!DOCTYPE html>
<html>
<style>
{{theme}}
html, body { margin: 0; height: 24px; overflow: hidden; background: var(--chrome); }
body { font-family: var(--font); font-size: var(--status-size); color: var(--text2); }
.st {
  display: flex;
  align-items: center;
  height: 24px;
  padding: 0 10px;
  box-sizing: border-box;
  border-top: 1px solid var(--border);
  white-space: pre;
}
.l { flex: 1; min-width: 0; overflow: hidden; }
.l.em { color: var(--accent); }
.r { flex: none; }
.r span { margin-left: 16px; }
</style>
<div class="st"><span class="{{left_class}}">{{left}}</span><span class="r">{{right}}</span></div>
</html>

<!DOCTYPE html>
<html>
<style>
{{theme}}
/* La línea de estado, sobre el marco (el mismo tono que la franja de pestañas). */
html, body { margin: 0; height: 24px; overflow: hidden; background: var(--frame); }
body { font-family: var(--font); font-size: var(--status-size); color: var(--text2); }
.st {
  display: flex;
  align-items: center;
  height: 24px;
  padding: 0 12px;
  box-sizing: border-box;
  border-top: 1px solid var(--border);
  white-space: pre;
}
.l { flex: 1; min-width: 0; overflow: hidden; }
.l.em { color: var(--accent-text); }
.r { flex: none; display: flex; align-items: center; }
.r span { padding-left: 10px; margin-left: 10px; border-left: 1px solid var(--border); line-height: 12px; }
.r span:first-child { border-left: 0; margin-left: 0; }
</style>
<div class="st"><span class="{{left_class}}">{{left}}</span><span class="r">{{right}}</span></div>
</html>

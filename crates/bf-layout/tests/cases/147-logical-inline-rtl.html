<!DOCTYPE html>
<!-- CSS Logical 1 §4: margin-inline-start, padding-inline y border-inline-end se asignan al lado físico según el direction del elemento (rtl: inline-start es la derecha) y compiten en cascada con las físicas. CSS 2.2 §10.3.3: sobre-restringido, con el containing block rtl se ignora margin-left; con el bloque rtl dentro de uno ltr, margin-right. -->
<style>body{margin:0} .b{width:100px;height:10px;margin-inline-start:30px;padding-inline:10px 0;border-inline-end:5px solid} #c{margin-right:7px}</style>
<div class=b></div>
<div dir=rtl><div class=b></div><div class=b id=c></div></div>
<div class=b dir=rtl></div>

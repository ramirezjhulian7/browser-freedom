<!DOCTYPE html>
<!-- CSS Grid 2 §9: subgrid en columnas (pistas, nombres de línea y mbp en los bordes) y en filas. -->
<style>
body{margin:0}
#g{display:grid;grid-template-columns:50px [m] auto 100px;column-gap:10px;justify-content:start}
#s{display:grid;grid-column:1/4;grid-template-columns:subgrid [a] [b];padding:0 5px}
#s>div{height:10px}
#x{grid-column:m}
#r{display:grid;grid-template-rows:20px auto;grid-template-columns:100px}
#t{display:grid;grid-row:1/3;grid-template-rows:subgrid;border-top:3px solid}
</style>
<div id=g><div id=s><div>a</div><div>aaaaaaaa</div><div id=x></div></div></div>
<div id=r><div id=t><div>a</div><div style="height:50px"></div></div></div>

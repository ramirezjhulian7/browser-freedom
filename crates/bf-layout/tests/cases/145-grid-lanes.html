<!DOCTYPE html>
<!-- CSS Grid 3: display grid-lanes con columnas como eje de rejilla; repeat(auto-fill, auto) con tamaño hipotético (§3.1.1, 3 pistas de 100px) y colocación en la pista más corta (§4.4, flow-tolerance 0). -->
<style>body{margin:0} #g{display:grid-lanes;grid-template-columns:repeat(auto-fill,auto);flow-tolerance:0;width:300px} #g>div{width:100px}</style>
<div id=g><div style="height:50px"></div><div style="height:30px"></div><div style="height:40px"></div><div style="height:20px"></div><div style="height:10px"></div></div>

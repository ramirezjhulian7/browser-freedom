<!DOCTYPE html>
<!-- CSS Grid 2 §7.1 con direction: rtl: columnas de derecha a izquierda, justify-self start/end reflejados. -->
<style>body{margin:0} #g{display:grid;direction:rtl;grid-template-columns:100px 200px;justify-items:start;position:relative} #g>div{height:10px;width:20px} #a{position:absolute;grid-column:2;top:0}</style>
<div id=g><div></div><div></div><div style="justify-self:end"></div><div id=a></div></div>

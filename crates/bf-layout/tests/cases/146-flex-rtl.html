<!DOCTYPE html>
<!-- CSS Flexbox 1 §5.1 con direction: rtl: en filas el main-start es la derecha (row-reverse lo devuelve a la izquierda) y el margen main-start es el derecho; justify-content: left es físico; en columnas el cross-start es la derecha y self-start sigue el direction del ítem. -->
<style>body{margin:0} .f{display:flex;direction:rtl;width:200px;height:20px} .f>div{width:20px;height:10px}</style>
<div class=f id=a><div style="margin-right:5px"></div><div></div></div>
<div class=f id=b style="flex-direction:row-reverse"><div style="margin-left:5px"></div><div></div></div>
<div class=f id=c style="justify-content:left"><div></div></div>
<div class=f id=d style="flex-direction:column;align-items:flex-start;height:auto"><div></div><div style="align-self:self-start;direction:ltr"></div></div>
<div class=f id=e style="justify-content:start;flex-direction:row-reverse"><div></div></div>
